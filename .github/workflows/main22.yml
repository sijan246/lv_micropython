name: Build ESP32 WROOM-32 with ST7735 & LVGL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-esp32-wroom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Automatically pulls internal libraries

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-cache: 'pip'
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev libffi-dev git pkg-config parallel

      # Cleared out the faulty external git clone logic. 
      # Since this runs inside your repo, make.py is already here!

      - name: Install Python Requirements
        run: |
          pip install pyparsing

      - name: Build Firmware for Non-PSRAM WROOM-32
        run: |
          # Sync internal submodules natively via the build script manager
          python3 make.py esp32 submodules clean BOARD=ESP32_GENERIC --DISPLAY=st7735
          
          # Compile the main firmware binary matching your WROOM setup
          python3 make.py esp32 BOARD=ESP32_GENERIC --DISPLAY=st7735

      - name: Upload WROOM-32 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wroom-st7735-firmware
          path: |
            build-*.bin
            ports/esp32/build-*/firmware.bin
